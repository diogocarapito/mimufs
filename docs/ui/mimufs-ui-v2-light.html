<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mimufs — UI v2 (claro)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app.dark{--bg:#0E1116;--chrome:#0B0D11;--panel:#141921;--panel2:#10141A;--border:#232A35;--line:#1E252F;--text:#D7DDE4;--strong:#F1F4F8;--muted:#8B95A3;--muted2:#A3ADBA;--hover:#171C24;--sel:#1D2432;--selbar:#FBBF24;--accent:#FBBF24;--accentText:#FBBF24;--onAccent:#0E1116;--ok:#4ADE80;--warn:#FBBF24;--err:#F87171;--pend:#8B95A3;--drop:#3A4453;--disabled:#232A35;--disabledText:#8B95A3}
.app.light{--bg:#F4F5F7;--chrome:#E9ECF0;--panel:#FFFFFF;--panel2:#F8F9FA;--border:#D6DBE1;--line:#E6E9ED;--text:#1F2630;--strong:#0E1116;--muted:#59626F;--muted2:#454D59;--hover:#EBEEF2;--sel:#FDF1D8;--selbar:#B45309;--accent:#B45309;--accentText:#9A4708;--onAccent:#FFFFFF;--ok:#15803D;--warn:#B45309;--err:#B91C1C;--pend:#6B7280;--drop:#B8C0CA;--disabled:#E1E5EA;--disabledText:#59626F}
.app a{color:var(--accentText)}.app a:hover{text-decoration:underline}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-err{color:var(--err)}.st-pend{color:var(--pend)}
.mono{font-family:'JetBrains Mono',monospace}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.phase{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 12px 6px 10px;border:0;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;text-align:left;cursor:pointer;border-radius:6px}
.phase:hover{background:var(--hover)}
.phase.cur{color:var(--strong)}
.sub{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 10px 4px 34px;border:0;border-left:2px solid transparent;background:transparent;color:var(--text);font:400 13px Inter,sans-serif;text-align:left;cursor:pointer}
.sub:hover{background:var(--hover)}
.sub.sel{background:var(--sel);border-left-color:var(--selbar);color:var(--strong)}
.subx{display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 10px 3px 34px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:6px;font:600 13px Inter,sans-serif;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--onAccent)}
.btn[disabled]{background:var(--disabled);border-color:var(--disabled);color:var(--disabledText);cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
.icon-btn:hover{background:var(--hover)}
.label{margin:0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--strong)}
.field input,.field textarea,.field select{font:400 14px Inter,sans-serif;color:var(--strong);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:9px 10px;min-height:20px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field .hint{font-size:12px;color:var(--muted)}
.field.err input{border-color:var(--err)}
.field .msg{font-size:12px;color:var(--err);font-weight:600}
.recent{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.recent:hover{background:var(--hover)}
</style>

<style>
html,body{margin:0;min-height:100%}
body{background:#2a2f37;display:flex;justify-content:center;align-items:flex-start;padding:24px;box-sizing:border-box}
#root{box-shadow:0 20px 60px rgba(0,0,0,.45);border-radius:10px;overflow:hidden}
</style>
</head>
<body>
<!-- mimufs UI direction "B v2" — standalone interactive mockup (1440×900 desktop window).
     Generated from the design canvas; data is fictional. Not production code: the real UI is PySide6 (see docs/TECH_SPECS.md §14). -->
<div id="root"></div>
<template id="tpl">
<div class="{{ themeCls }}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 13px">

<header style="flex: none; height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 16px; background: var(--chrome); border-bottom: 1px solid var(--border)">
<button type="button" onClick="{{ goHome }}" title="Início" class="mono" style="border: 0; background: transparent; padding: 0; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--accentText)">mimufs</button>
<span class="mono" style="font-size: 12px; color: var(--muted)">{{ projFile }}</span>
<span style="flex-grow: 1"></span>
<span class="st-ok mono" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg> offline · 0 ligações de rede</span>
<button type="button" class="icon-btn" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" onClick="{{ toggleTheme }}"><template data-sc="if" value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></template><template data-sc="if" value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></template></button>
<button type="button" class="icon-btn" aria-label="Definições" title="Definições"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
</header>

<template data-sc="if" value="{{ isHome }}" hint-placeholder-val="{{ false }}">
<main class="scroll" aria-label="Início" style="flex: 1 1 0; min-height: 0; display: flex; justify-content: center; padding: 48px 32px">
<div style="width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="label">mimufs · v0.1.0</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; color: var(--strong); letter-spacing: -0.015em">Projetos</h1>
<p style="margin: 0; font-size: 14px; color: var(--muted2); max-width: 60ch">Processamento dos dados do MIM@UF e do SClínico, inteiramente neste computador.</p>
</div>
<div style="display: flex; gap: 10px">
<button type="button" class="btn">Abrir projeto…</button>
<button type="button" class="btn primary" onClick="{{ openDialog }}">+ Novo projeto</button>
</div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 class="label">Projetos recentes</h2>
<template data-sc="for" list="{{ recents }}" as="rp" hint-placeholder-count="2">
<button type="button" class="recent" onClick="{{ rp.open }}">
<div style="width: 40px; height: 40px; flex: none; border-radius: 8px; background: var(--sel); color: var(--accentText); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600; color: var(--strong)">{{ rp.name }}</span>
<span style="font-size: 13px; color: var(--muted2)">{{ rp.meta }}</span>
<span class="mono" style="font-size: 11px; color: var(--muted)">{{ rp.path }}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none">
<span style="font-size: 12px; color: var(--muted2)">{{ rp.progress }}</span>
<span class="mono" style="font-size: 11px; color: var(--muted)">{{ rp.when }}</span>
</div>
</button>
</template>
</section>
<aside style="display: flex; flex-direction: column; gap: 16px">
<section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 class="label">Dicionários</h2>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="color: var(--strong)">Medicamentos</span><span class="mono" style="color: var(--muted)">75 termos · editável</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="color: var(--strong)">ICPC-2 (v4.4 PT)</span><span class="mono" style="color: var(--muted)">726 códigos</span></div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="color: var(--strong)">Indicadores</span><span class="mono" style="color: var(--muted)">173 intervalos</span></div>
<button type="button" class="btn" style="align-self: flex-start">Gerir dicionários</button>
</section>
<section class="card" style="padding: 16px; display: flex; gap: 10px; align-items: flex-start">
<span class="st-ok" style="display: flex; padding-top: 1px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted2)">Nenhum dado sai deste computador. A única ligação à internet é a verificação de novas versões, que pode desligar nas Definições.</p>
</section>
</aside>
</div>
</div>
</main>
</template>
<template data-sc="if" value="{{ isProject }}" hint-placeholder-val="{{ true }}">
<div style="flex: 1 1 0; min-height: 0; display: flex">

<nav aria-label="Fases e sub-passos" style="flex: none; width: 296px; display: flex; flex-direction: column; background: var(--panel2); border-right: 1px solid var(--border)">
<div style="flex: none; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line)">
<span class="label">Projeto</span>
<span style="font-size: 14px; font-weight: 600; color: var(--strong)">{{ projTitle }}</span>
<span style="font-size: 12px; color: var(--muted2)">Médico: {{ projDoctor }}</span>
<template data-sc="if" value="{{ hasDesc }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; color: var(--muted)">{{ projDesc }}</span></template>
</div>
<div class="scroll" style="flex: 1 1 0; min-height: 0; padding: 8px 6px 16px; display: flex; flex-direction: column; gap: 2px">
<template data-sc="for" list="{{ phases }}" as="p" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column">
<button type="button" class="{{ p.headCls }}" onClick="{{ p.toggle }}" aria-expanded="{{ p.isOpen }}">
<span style="display: flex; color: var(--muted); transition: transform .15s; transform: {{ p.chevron }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span class="{{ p.cls }}" style="display: flex"><template data-sc="if" value="{{ p.isOk }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.7 2.7L16 9.8"></path></svg></template><template data-sc="if" value="{{ p.isWarn }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.8 19.5h18.4L12 3.5z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg></template><template data-sc="if" value="{{ p.isErr }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.2 3h7.6L21 8.2v7.6L15.8 21H8.2L3 15.8V8.2z"></path><path d="M9.5 9.5l5 5"></path><path d="M14.5 9.5l-5 5"></path></svg></template><template data-sc="if" value="{{ p.isPend }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg></template><template data-sc="if" value="{{ p.isSkip }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-dasharray="3 3"><circle cx="12" cy="12" r="9"></circle></svg></template><template data-sc="if" value="{{ p.isLock }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></template></span>
<span class="mono" style="font-size: 11px; color: var(--muted)">0{{ p.n }}</span>
<span style="flex-grow: 1">{{ p.label }}</span>
<span class="mono" style="font-size: 11px; font-weight: 500; color: var(--muted)">{{ p.progress }}</span>
</button>
<template data-sc="if" value="{{ p.isOpen }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; padding: 2px 0 8px">
<template data-sc="if" value="{{ p.notExtraction }}" hint-placeholder-val="{{ false }}">
<template data-sc="for" list="{{ p.subs }}" as="s" hint-placeholder-count="3">
<div class="subx"><span class="{{ s.cls }}" style="display: flex"><template data-sc="if" value="{{ s.isOk }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.7 2.7L16 9.8"></path></svg></template><template data-sc="if" value="{{ s.isWarn }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.8 19.5h18.4L12 3.5z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg></template><template data-sc="if" value="{{ s.isErr }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.2 3h7.6L21 8.2v7.6L15.8 21H8.2L3 15.8V8.2z"></path><path d="M9.5 9.5l5 5"></path><path d="M14.5 9.5l-5 5"></path></svg></template><template data-sc="if" value="{{ s.isPend }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg></template><template data-sc="if" value="{{ s.isSkip }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-dasharray="3 3"><circle cx="12" cy="12" r="9"></circle></svg></template><template data-sc="if" value="{{ s.isLock }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></template></span>{{ s.label }}</div>
</template>
</template>
<template data-sc="if" value="{{ p.isExtraction }}" hint-placeholder-val="{{ true }}">
<template data-sc="for" list="{{ sections }}" as="sec" hint-placeholder-count="6">
<p class="mono" style="margin: 8px 0 2px 34px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">{{ sec.name }}</p>
<template data-sc="for" list="{{ sec.items }}" as="r" hint-placeholder-count="3">
<button type="button" class="{{ r.subCls }}" onClick="{{ r.pick }}">
<span class="{{ r.cls }}" style="display: flex"><template data-sc="if" value="{{ r.isOk }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.7 2.7L16 9.8"></path></svg></template><template data-sc="if" value="{{ r.isWarn }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.8 19.5h18.4L12 3.5z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg></template><template data-sc="if" value="{{ r.isErr }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.2 3h7.6L21 8.2v7.6L15.8 21H8.2L3 15.8V8.2z"></path><path d="M9.5 9.5l5 5"></path><path d="M14.5 9.5l-5 5"></path></svg></template><template data-sc="if" value="{{ r.isPend }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg></template><template data-sc="if" value="{{ r.isSkip }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-dasharray="3 3"><circle cx="12" cy="12" r="9"></circle></svg></template><template data-sc="if" value="{{ r.isLock }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></template></span>
<span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.title }}</span>
<span class="mono" style="font-size: 10px; color: var(--muted)">{{ r.progress }}</span>
</button>
</template>
</template>
<p class="mono" style="margin: 10px 0 2px 34px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Fim do passo</p>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, patch); window.__render(); }
  forceUpdate() { window.__render(); }
}
(function () {
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const parts = path.split('.');
    let v = scope[parts[0]];
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  const interp = (s, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
  function renderChildren(src, scope, out) { src.childNodes.forEach((c) => renderNode(c, scope, out)); }
  function renderNode(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'TEMPLATE' && node.dataset.sc) {
      const kind = node.dataset.sc;
      const content = node.content;
      if (kind === 'if') {
        const m = (node.getAttribute('value') || '').match(WHOLE);
        if (m && lookup(m[1], scope)) renderChildren(content, scope, out);
      } else {
        const m = (node.getAttribute('list') || '').match(WHOLE);
        const list = (m && lookup(m[1], scope)) || [];
        const as = node.getAttribute('as') || 'item';
        list.forEach((item, i) => renderChildren(content, Object.assign(Object.create(scope), { [as]: item, $index: i }), out));
      }
      return;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName)
      : document.createElement(node.localName);
    for (const a of node.attributes) {
      const m = a.value.match(WHOLE);
      if (a.name.startsWith('on') && m) {
        const fn = lookup(m[1], scope);
        if (typeof fn === 'function') el.addEventListener(a.name.slice(2), (e) => { if (a.name === 'onclick') e.preventDefault(); fn(e); });
        continue;
      }
      if (a.name === 'defaultvalue') { const dv = m ? lookup(m[1], scope) : a.value; el.__dv = dv == null ? '' : String(dv); continue; }
      if (m) {
        const v = lookup(m[1], scope);
        if (v === false || v == null) { if (a.name === 'aria-expanded') el.setAttribute(a.name, 'false'); continue; }
        el.setAttribute(a.name, v === true ? (a.name.startsWith('aria-') ? 'true' : '') : String(v));
      } else {
        el.setAttribute(a.name, interp(a.value, scope));
      }
    }
    if (node.tagName === 'TEMPLATE') { renderChildren(node.content, scope, el.content); }
    else renderChildren(node, scope, el);
    if (el.__dv !== undefined) el.value = el.__dv;
    out.appendChild(el);
  }
  window.__mount = function (Component, props) {
    const tpl = document.getElementById('tpl');
    const root = document.getElementById('root');
    const comp = new Component(props);
    window.__render = function () {
      const scrolls = [...root.querySelectorAll('.scroll')].map((e) => e.scrollTop);
      const frag = document.createDocumentFragment();
      renderChildren(tpl.content, comp.renderVals(), frag);
      root.replaceChildren(frag);
      root.querySelectorAll('.scroll').forEach((e, i) => { if (scrolls[i] != null) e.scrollTop = scrolls[i]; });
    };
    window.__render();
  };
})();

</script>
