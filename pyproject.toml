[project]
name = "mimufs"
version = "0.0.1"
description = "Guided, local-only processing of MIM@UF reports for Portuguese family-medicine units"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Carapito" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Healthcare Industry",
    "Natural Language :: Portuguese",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Keep in sync with [tool.briefcase.app.mimufs].requires (checked by tests/test_packaging.py).
dependencies = [
    "pyside6-essentials>=6.8",
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "openpyxl==3.1.5",  # exact pin: openpyxl_compat patches a private module
    "xlrd>=2.0",
    "tabula-py>=2.10",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "xlsxwriter>=3.2",
    "platformdirs>=4.3",
    "truststore>=0.10",
    "packaging>=24",
]

[project.urls]
Homepage = "https://mimufs.com"
Repository = "https://github.com/diogocarapito/mimufs"
Changelog = "https://mimufs.com/changelog.html"

[project.scripts]
mimufs = "mimufs.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-socket>=0.7",
    "briefcase>=0.3.20",
    "xlwt>=1.3",  # only to write the legacy-BIFF test fixture
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimufs"]
exclude = ["src/mimufs/_runtime"]

# --------------------------------------------------------------------------- tools

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT"]
# PT-PT text legitimately uses en dashes, typographic quotes, etc.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/mimufs/core"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "xlrd.*", "tabula.*", "xlwt.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--disable-socket", "--allow-unix-socket"]
xfail_strict = true
markers = [
    "requires_java: needs a Java runtime (bundled JRE or a system Java)",
    "gui: Qt widget tests (pytest-qt, offscreen)",
    "needs_input: waits for an input from Diogo (see CLAUDE.md); marked xfail until it arrives",
]
