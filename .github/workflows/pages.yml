name: Pages

# Deploys site/ to GitHub Pages (mimufs.com). Called by release.yml after the GitHub Release
# exists, so version.json never announces a version without downloads. Run it by hand for
# text-only site changes on main.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
